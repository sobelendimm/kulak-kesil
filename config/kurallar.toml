# ---- TÜR ALT PROFİLLERİ: şarkı adı ipuçları -------------------------------
# Şarkı adında bu ifade geçerse o PARÇA için müzik türü bu olur (sanatçının
# türünden önce gelir; ama sanatçıya elle verdiğin tür her zaman kazanır).
# Anahtar = düzenli ifade (küçük harfe çevrilmiş başlıkta aranır),
# değer = metal_rock | elektronik | klasik_akustik | pop_vokal | konusma.
# Yerleşik ipuçları (acoustic/akustik/unplugged → klasik_akustik,
# remix/club mix → elektronik, podcast/bölüm N → konusma) zaten açık;
# burada yenilerini ekleyebilir ya da aynı ifadeyle değiştirebilirsin.
[tur]
baslik_ipucu = { "\\b(senfoni|symphony)\\b" = "klasik_akustik" }
