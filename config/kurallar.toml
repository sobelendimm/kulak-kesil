]
# Süreç adı/çalıştırılabilir bunlardan biriyse oyundur (wine yükleyicisi).
wine_ikili = ["wine", "wine64", "wine-preloader", "wine64-preloader", "wineserver"]
# Üst süreçlerden birinin adı ya da komut satırı bunlara uyarsa oyundur.
