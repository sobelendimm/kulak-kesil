# ============================================================================
#  Kulak Kesil (oto-eq) — sınıflandırma kuralları (kurallar.toml)
# ============================================================================
#
#  Bu dosya, çalan her sesin (akışın) hangi EQ profiline gideceğini belirler.
#  Kendi kopyanız: ~/.config/oto-eq/kurallar.toml (varsa o kullanılır).
#  Değişiklikten sonra:  kulak yenile
#  (Kulak Kesil arayüzünden yapılan uygulama atamaları bu dosyadan ÖNCE gelir.)
#
#  Kategoriler:
#    cs2        Counter-Strike 2 (ayak sesi odaklı)
#    oyun       diğer oyunlar (atmosfer)
#    muzik      müzik (ton doğruluğu)
#    film       film / dizi / video (diyalog)
#    sesli      Discord, TeamSpeak, görüşmeler  -> HER ZAMAN EQ'suz
#    sistem     bildirim sesleri, ekran okuyucu -> HER ZAMAN EQ'suz
#    bilinmeyen hiçbir kurala uymayan
#
#  Desenler: "regex" (düzenli ifade), büyük/küçük harf duyarsız.
#    * Ad listeleri ve ikili/uygulama/flatpak/medya_rolu/steam_appid alanları
#      TAM eşleşir: "spotify" sadece "spotify"yi yakalar. Parça eşleşme için
#      ".*" kullanın: "spotify.*"
#    * medya_adi, ata, url, ozellik ve ortam değerleri PARÇA eşleşir
#      (metnin içinde geçmesi yeter).
#
#  Ad listelerindeki bir değer şunlarla karşılaştırılır: ikili ad
#  (application.process.binary), uygulama adı (application.name), süreç adı
#  (/proc/<pid>/comm), çalıştırılabilir dosya adı, flatpak kimliği.
#
#  Bir anahtarı bu dosyadan silerseniz programın içindeki varsayılan (bu
#  dosyanın orijinal hâli) kullanılır. Bir listeyi yazarsanız varsayılan
#  listenin YERİNE geçer (eklenmez).
# ============================================================================

[genel]
# Kulak Kesil, varsayılan çıkış bir KULAKLIK olduğunda çalışır. Kulaklık türü
# kendiliğinden tanınır: USB kulaklık / kulaklık seti, Bluetooth kulaklık ve
# anakartın 3,5 mm kulaklık girişi. Hoparlöre (hat çıkışı), HDMI'ye (monitör/TV)
# ya da Bluetooth hoparlöre geçince tüm sesler EQ'suz kalır.
# HS80 düzeltme eğrisi (profiller.toml [duzeltme]) yalnız HS80'de uygulanır;
# başka kulaklıkta düzeltme nötr, profil EQ'ları çalışmaya devam eder.
#
# Bu desene uyan çıkış HER ZAMAN kulaklık sayılır (otomatik tespiti tanımadığı
# bir kulaklık için). Desen; çıkış adı, açıklaması ve model adıyla karşılaştırılır.
kulaklik_desen = "(?i)hs80"
# Bu desene uyan çıkış HİÇBİR ZAMAN kulaklık sayılmaz. "" = yok.
kulaklik_haric = ""
# false: otomatik tespit kapalı, yalnız kulaklik_desen'e uyan çıkışlar (eski davranış).
kulaklik_otomatik = true

# HS80 takibi: kulaklık kablosuz <-> kablolu moda geçince (USB-C kablo takılınca
# alıcı kaybolur, "HS80 RGB USB" adlı YENİ bir cihaz belirir) WirePlumber varsayılanı
# hoparlöre düşürebilir. true ise: eski HS80 kaybolduktan sonra 30 sn içinde diğer
# HS80 belirirse önce sesi ESKİ seviyeye ayarlanır (asla daha yüksek değil; eski
# seviye bilinmiyorsa %40), sonra varsayılan çıkış/mikrofon yapılır. Arada siz
# varsayılanı elle değiştirdiyseniz dokunulmaz. "Kulak Kesil · Mikrofon" varsayılan
# mikrofonsa o kalır, yalnızca sanal mikrofonun girişi yeni HS80'e taşınır.
hs80_takip = true

# Hiçbir kurala uymayan akışların profili. "" = EQ'suz.
# "muzik" profili en düz/doğal düzeltmedir; tanınmayan sesler için güvenli seçim.
bilinmeyen_profil = "muzik"

# Kontrol sırası: ilk eşleşen kazanır. Adımları silebilir/sırasını
# değiştirebilirsiniz. Geçerli adlar:
#   kullanici  aşağıdaki [[kural]] listesi
#   cs2        Counter-Strike 2
#   sesli      sesli sohbet uygulamaları + medya rolü phone/communication
#   sistem     sistem sesleri + medya rolü event/notification/a11y
#   oyun       Proton/wine/umu/Lutris/Faugus/Steam oyunları, .exe'ler
#   oynatici   çok amaçlı oynatıcılar (mpv, VLC): ses dosyası -> muzik, değilse film
#   rol        uygulamanın bildirdiği medya rolü ([roller] tablosu)
#   uygulama   bilinen müzik/film uygulamaları
#   tarayici   tarayıcılar (site / başlık ile müzik-film ayrımı)
sira = ["kullanici", "cs2", "sesli", "sistem", "oyun", "oynatici", "rol", "uygulama", "tarayici"]

# ----------------------------------------------------------------------------
[eslesme]
# Kategori -> EQ profili. Profil adları: cs2, oyun, muzik, film. "" = EQ'suz.
# (sesli ve sistem burada ne yazarsa yazsın HER ZAMAN EQ'suzdur.)
cs2 = "cs2"
oyun = "oyun"
muzik = "muzik"
film = "film"
sesli = ""
sistem = ""

# ----------------------------------------------------------------------------
#  KULLANICI KURALLARI — en önce bakılır, yukarıdan aşağı ilk eşleşen kazanır.
#  Bir kuraldaki TÜM alanlar uymalıdır (VE). Kullanılabilir alanlar:
#    ad          kuralın adı (sadece açıklamada görünür)
#    ikili       application.process.binary / süreç adı / exe       (tam)
#    uygulama    application.name                                   (tam)
#    medya_adi   media.name (pencere/sekme/dosya başlığı)           (parça)
#    medya_rolu  media.role (Music, Movie, Game, event ...)         (tam)
#    flatpak     flatpak kimliği, ör. "com.spotify.Client"          (tam)
#    steam_appid Steam uygulama no (SteamAppId/SteamGameId/AppId=)  (tam)
#    ortam       ortam değişkenleri tablosu, ör. { GAMEID = "umu-.*" } (parça)
#    ata         üst süreçlerin adı veya komut satırı               (parça)
#    url         tarayıcı/oynatıcı MPRIS adresi (xesam:url)         (parça)
#    ozellik     akış özellikleri tablosu, ör. { "node.name" = "x" } (parça)
#    kategori    ZORUNLU: cs2 / oyun / muzik / film / sesli / sistem
#    profil      İSTEĞE BAĞLI: kategorinin profilini ezer ("" = EQ'suz)
#
#  Bir alana liste de yazılabilir: ikili = ["mpv", "vlc"] = "bunlardan biri".
#  Büyük/küçük harf zaten duyarsız; "(?i)" gerekmez (yazılırsa da çalışır).
#
#  Örnekler (başındaki # işaretini kaldırarak açın):
#
#  [[kural]]
#  ad = "Witcher 3 film gibi dinlensin"
#  ikili = "witcher3\\.exe"
#  kategori = "film"
#
#  [[kural]]
#  ad = "YouTube'da her şey müzik"
#  url = "youtube\\.com"
#  kategori = "muzik"
#
#  [[kural]]
#  ad = "Faugus'taki bir oyun"
#  ortam = { WINEPREFIX = "Faugus/oyunum" }
#  kategori = "oyun"
#
#  [[kural]]
#  ad = "Tarayıcıdaki Twitch EQ'suz olsun"
#  url = "twitch\\.tv"
#  kategori = "film"
#  profil = ""

# ----------------------------------------------------------------------------
[cs2]
# CS2 Linux'ta yerel çalışır: ikili "cs2", Steam uygulama no 730.
ikili = ["cs2"]
steam_appid = ["730"]

# ----------------------------------------------------------------------------
[roller]
# media.role -> kategori. Çoğu uygulama rol bildirmez; bildirenler için.
# (Firefox/Chrome rol bildirmez. mpv ses dosyasında "Music", videoda "Movie" der.)
event = "sistem"
notification = "sistem"
a11y = "sistem"
accessibility = "sistem"
alarm = "sistem"
test = "sistem"
phone = "sesli"
communication = "sesli"
game = "oyun"
music = "muzik"
video = "film"
movie = "film"
animation = "film"

# ----------------------------------------------------------------------------
