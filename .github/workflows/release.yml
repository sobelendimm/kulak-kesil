name: Release

# On a version tag (vX.Y.Z): build the AppImage and attach it to a DRAFT release.
# The release stays a draft until the maintainer publishes it by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04   # old glibc: the AppImage runs on older distros too
    steps:
      - uses: actions/checkout@v4
      - name: Build the AppImage
        run: VERSION="${GITHUB_REF_NAME#v}" packaging/appimage/build.sh dist
      - name: Smoke test
        run: |
          f=(dist/kulak-kesil-*-x86_64.AppImage)
          "${f[0]}" --appimage-extract-and-run --help
      - name: Checksum
        run: cd dist && sha256sum ./*.AppImage > SHA256SUMS
      - name: Draft release with the AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
            dist/*.AppImage dist/SHA256SUMS
