name: Release

# On a version tag (vX.Y.Z): build the AppImage and attach it to a DRAFT release.
# The release stays a draft until the maintainer publishes it by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04   # old glibc: the AppImage runs on older distros too
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match pkgver in the PKGBUILD
        run: |
          v=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME != pkgver $v" >&2; exit 1; }
      - name: Build the AppImage
        # the build imports PyQt6 (icon generation): it needs the EGL/GL/xkb/fontconfig/dbus runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
          QT_QPA_PLATFORM=offscreen VERSION="${GITHUB_REF_NAME#v}" packaging/appimage/build.sh dist
      - name: Smoke test
        run: |
          f=(dist/kulak-kesil-*-x86_64.AppImage)
          "${f[0]}" --appimage-extract-and-run --help
          "${f[0]}" --appimage-extract-and-run --cli --help
      - name: Checksum
        run: cd dist && sha256sum ./*.AppImage > SHA256SUMS
      - name: Draft release with the AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
            dist/*.AppImage dist/SHA256SUMS
